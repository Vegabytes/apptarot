<ion-content [fullscreen]="true" role="main">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:20px;background:#1a1a2e;color:#fff;">
    <ion-icon name="wifi" style="font-size:80px;color:#888;margin-bottom:20px;" aria-hidden="true"></ion-icon>
    <h2 style="margin-bottom:16px;">Sin conexión a Internet</h2>
    <p style="margin-bottom:24px;color:#aaa;" aria-live="polite">Por favor, comprueba tu conexión e inténtalo de nuevo.</p>
    <ion-button (click)="retry()" mode="md">Reintentar</ion-button>
    <p *ngIf="offlineMessage" class="error-container" style="margin-top:16px;" aria-live="assertive">{{ offlineMessage }}</p>
  </div>
</ion-content>
