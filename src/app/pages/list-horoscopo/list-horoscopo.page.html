<ion-header class="header-gradient">
  <ion-toolbar>
    <ion-back-button mode="md" slot="start" defaultHref="/menu" icon="chevron-back-outline" aria-label="Volver al menú"></ion-back-button>
    <ion-buttons slot="end">

      <ion-button (click)="bntShare()" aria-label="Compartir">
        <img src="../../../assets/img/icono_compartir.png" alt="Compartir" style="width: 25px;" />
      </ion-button>
      <ion-button (click)="openMenu()" aria-label="Abrir menú de navegación">
        <img src="../../../assets/img/icono_menu.png" alt="Menú" style="width: 30px; height: 25px;" />
      </ion-button>
    </ion-buttons>
    <ion-title mode="md" class="text-header" slot="start">
      Horóscopo
     </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" role="main">

<div class="box-list-horoscopo" role="list">
  <ion-card class="custom-card" *ngFor="let z of zodiacs; trackBy: trackByZodiacId" (click)="buscarTarotActivo(z.id)" role="listitem" tabindex="0" (keydown.enter)="buscarTarotActivo(z.id)" [attr.aria-label]="'Ver horóscopo de ' + z.name">
    <img [src]="z.image" [alt]="'Signo del zodiaco: ' + z.name" loading="lazy" />
      <ion-text>{{z.name}}</ion-text>
  </ion-card>
</div>
<ion-row>
  <ion-col size="10" offset="1" *ngIf="!loadinfo">
    <div class="button-container-result">
      <ion-button class="gradient-button-result" mode="md" (click)="makeCall(phoneNumber)" aria-label="Llamar al +34 910 209 955 para escuchar la lectura completa">
        <img src="../../../assets/img/icono_tel.png" alt="Icono de teléfono" class="ico-llamar" loading="lazy">
       <div>
        <div> LLAMA AHORA  A MI LÍNEA</div>
        <div class="text-small">Y ESCUCHA LA LECTURA COMPLETA</div>
       </div>
      </ion-button>
    </div>
  </ion-col>
</ion-row>
<ion-row>
  <ion-col size="10" offset="1">
    <div *ngIf="errorMsg" style="text-align: center; padding: 20px; color: #ff6b6b;" aria-live="polite">
      <p>{{ errorMsg }}</p>
      <ion-button fill="outline" size="small" (click)="retry()">Reintentar</ion-button>
    </div>
  </ion-col>
</ion-row>

</ion-content>
