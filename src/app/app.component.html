<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content >


        <ion-list id="labels-list" class="ion-content-menu" mode="md">

          <div class="img-top">
            <img src="../assets/img/marco_sup.png" alt="Menu" style="" />
           </div>
         <div class="centrado-item">
          <ion-item lines="none" class="item-menu" mode="md" (click)="irWeb()">
            <ion-label mode="md">Nuestra web</ion-label>
          </ion-item>
          <ion-item lines="none" class="item-menu" mode="md" (click)="irPolitica()">
            <ion-label mode="md">Política de privacidad</ion-label>
          </ion-item>
          <ion-item lines="none" class="item-menu" mode="md" (click)="openStore()">
            <ion-label mode="md">Valora nuestra App</ion-label>
          </ion-item>
         </div>
          <div class="img-inf">
            <img src="../assets/img/marco_inf.png" alt="Menu" style="" />
           </div>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
